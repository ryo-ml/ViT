seed: 42

wandb:
  project: vit-cifar100
  enabled: true

model:
  _target_: src.models.vision_transformer.VisionTransformer
  img_size: [224, 224]
  patch_size: 16
  in_channels: 3
  d_model: 768
  dropout: 0.1
  num_layers: 12
  num_heads: 12
  qkv_bias: true
  num_classes: 100

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-4

loss:
  _target_: torch.nn.CrossEntropyLoss

training:
  num_epochs: 10
  train_val_split: [0.9, 0.1]
  batch_size: 64
  log_interval: 100

eval:
  checkpoint_path: ???

device: mps
